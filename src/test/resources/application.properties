# Configuracao usada SOMENTE nos testes: banco em memoria (H2), sem precisar de Postgres.
spring.datasource.url=jdbc:h2:mem:rentacar_teste;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.secret=chave-somente-para-testes-1234567890
spring.tempo_expiracao=30
cors.allowed-origins=http://localhost:3000
